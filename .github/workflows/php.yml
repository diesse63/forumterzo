name: Verifica PHP e utenti
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_only_password
          MYSQL_DATABASE: poimanager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest_only_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Sintassi PHP
        run: find . -name '*.php' -not -path './private/config.php' -print0 | xargs -0 -n1 php -l
      - name: Test utenti e importazione su database effimero
        env:
          POIMANAGER_TEST: '1'
        run: |
          php tests/utenti.php
          php tests/import_tabelle.php
          php tests/check_schema.php
          php tests/ghost.php
      - name: Compatibilità cifratura e HTTPS senza Sodium e cURL
        run: |
          php tests/relazioni_tabelle.php
          php tests/schema_sqlite.php
          php tests/deposito.php
          php tests/compatibilita.php
          php -d disable_functions=sodium_crypto_secretbox,sodium_crypto_secretbox_open,curl_init,curl_exec tests/compatibilita.php
      - name: Verifica layout e menu nel browser
        run: |
          php tests/render_layout.php > /tmp/poimanager-layout.html
          npm install --no-save --package-lock=false playwright@1.56.1
          node tests/layout.cjs
